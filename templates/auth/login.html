{% extends 'base.html' %}

{% block auth_content %}
<section class="auth-center-shell">
    <div class="auth-mock-card auth-form-card">
        <div class="auth-heart-badge"></div>
        <h1>HormonaCare</h1>
        <p class="auth-subtitle">Your personalized PCOS health companion</p>
        <form
            method="post"
            class="form-grid auth-form-tight"
            data-login-form
            data-clear-autofill="{{ 'true' if not form_values.email and not form_errors else 'false' }}"
            autocomplete="off"
            novalidate
        >
            <input type="text" name="login_shadow_email" value="" autocomplete="username" tabindex="-1" aria-hidden="true" class="auth-shadow-input">
            <input type="password" name="login_shadow_password" value="" autocomplete="current-password" tabindex="-1" aria-hidden="true" class="auth-shadow-input">
            <label>Email
                <div class="auth-input-wrap {% if form_errors.email %}is-invalid{% endif %}">
                    <span class="auth-input-icon user"></span>
                    <input type="email" name="email" value="{{ form_values.email }}" placeholder="you@example.com" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                </div>
                {% if form_errors.email %}<small class="field-error">{{ form_errors.email }}</small>{% endif %}
            </label>
            <label>Password
                <div class="auth-input-wrap {% if form_errors.password %}is-invalid{% endif %}">
                    <span class="auth-input-icon lock"></span>
                    <input type="password" name="password" placeholder="Enter your password" autocomplete="new-password" data-password-field required>
                    <button type="button" class="auth-password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false">
                        <span class="auth-password-eye" aria-hidden="true"></span>
                    </button>
                </div>
                {% if form_errors.password %}<small class="field-error">{{ form_errors.password }}</small>{% endif %}
            </label>
            <div class="auth-utility-row">
                <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
            </div>
            <button type="submit" class="auth-gradient-button">Sign In</button>
        </form>
        <p class="auth-footer-link">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</section>
{% endblock %}
